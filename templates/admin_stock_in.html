{% extends "base.html" %}
{% block content %}
<h2>Stock In - {{ product['name'] }}</h2>
<p>Current stock: {{ product['stock'] }}</p>

<form method="post">
    <label>Quantity to add</label>
    <input type="number" name="quantity" min="1" required>
    <button type="submit">Add Stock</button>
</form>
{% endblock %}
